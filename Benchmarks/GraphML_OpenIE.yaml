#    edges: [ depGraph, head, previousWord, fromSentence, nextWord, poscoarse, pos, edge, aspect, conjtype, definite, degree, mood, number, numtype, person, prontype, punctside, puncttype, tense, verbform]
#    edges_target: [ word, word, word, sentence, word, poscoarse, pos, edge, aspect, conjtype, definite, degree, mood, number, numtype, person, prontype, punctside, puncttype, tense, verbform]
    edges_uri: [http://www.ieeta-bit.pt/CaRB#depGraph, http://www.ieeta-bit.pt/CaRB#head, http://www.ieeta-bit.pt/CaRB#previousWord, http://www.ieeta-bit.pt/CaRB#fromSentence, http://www.ieeta-bit.pt/CaRB#poscoarse, http://www.ieeta-bit.pt/CaRB#pos, http://www.ieeta-bit.pt/CaRB#edge, http://www.ieeta-bit.pt/CaRB#aspect, http://www.ieeta-bit.pt/CaRB#case, http://www.ieeta-bit.pt/CaRB#conjtype, http://www.ieeta-bit.pt/CaRB#definite, http://www.ieeta-bit.pt/CaRB#degree, http://www.ieeta-bit.pt/CaRB#foreign, http://www.ieeta-bit.pt/CaRB#gender, http://www.ieeta-bit.pt/CaRB#mood, http://www.ieeta-bit.pt/CaRB#number, http://www.ieeta-bit.pt/CaRB#numtype, http://www.ieeta-bit.pt/CaRB#person, http://www.ieeta-bit.pt/CaRB#polarity, http://www.ieeta-bit.pt/CaRB#poss, http://www.ieeta-bit.pt/CaRB#prontype, http://www.ieeta-bit.pt/CaRB#punctside, http://www.ieeta-bit.pt/CaRB#puncttype, http://www.ieeta-bit.pt/CaRB#tense, http://www.ieeta-bit.pt/CaRB#verbform]
